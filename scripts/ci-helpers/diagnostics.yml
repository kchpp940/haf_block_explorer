.collect_diagnostics_base:
  script:
    - echo "=== Running diagnostics collection for ${CI_JOB_STAGE} stage ==="
    - ./scripts/ci-helpers/collect_diagnostics.sh \
        --stage="${CI_JOB_STAGE}" \
        --output-dir="${CI_DIAGNOSTICS_DIR}/${CI_JOB_STAGE}" \
        --postgres-access="postgresql://haf_admin@localhost:5432/haf_block_log" \
        --postgrest-url="http://localhost:3000" 2>&1 || true
    - echo "=== Diagnostics collection complete ==="

.collect_build_diagnostics:
  extends: .collect_diagnostics_base
  artifacts:
    paths:
      - ${CI_DIAGNOSTICS_DIR}/build/
    when: on_failure
    expire_in: 1 week

.collect_bootstrap_diagnostics:
  extends: .collect_diagnostics_base
  artifacts:
    paths:
      - ${CI_DIAGNOSTICS_DIR}/bootstrap/
    when: on_failure
    expire_in: 1 week

.collect_sql_diagnostics:
  extends: .collect_diagnostics_base
  artifacts:
    paths:
      - ${CI_DIAGNOSTICS_DIR}/sql-check/
    when: on_failure
    expire_in: 1 week

.collect_api_diagnostics:
  extends: .collect_diagnostics_base
  artifacts:
    paths:
      - ${CI_DIAGNOSTICS_DIR}/api-regression/
    when: on_failure
    expire_in: 1 week

.collect_performance_diagnostics:
  extends: .collect_diagnostics_base
  artifacts:
    paths:
      - ${CI_DIAGNOSTICS_DIR}/performance-smoke/
    when: on_failure
    expire_in: 1 week
