.start_hafbe_environment:
  script:
    - echo "=== Starting HAFBE environment (${CI_JOB_NAME}) ==="
    - source "${CI_ARTIFACTS_DIR}/build.env" 2>/dev/null || true
    - BACKEND_VERSION="${BUILD_TAG:-${CI_COMMIT_SHORT_SHA}}"
    - echo "Using backend version: ${BACKEND_VERSION}"
    - mkdir -p "${CI_LOGS_DIR}/${CI_JOB_STAGE}"
    - COMPOSE_OPTIONS_STRING="--env-file ci.env --file docker-compose.yml --file overrides/ci.yml" \
        ./scripts/ci-helpers/start-ci-test-environment.sh \
        --backend-version="${BACKEND_VERSION}" \
        --haf-data-directory="${HAF_DATA_DIRECTORY}" \
        --haf-shm-directory="${HAF_SHM_DIRECTORY}" \
        --setup-uid="${SETUP_UID}" 2>&1 | tee "${CI_LOGS_DIR}/${CI_JOB_STAGE}/startup.log"
    - echo "=== Waiting for HAF Block Explorer to be ready ==="
    - ./scripts/ci-helpers/wait-for-haf-be-startup.sh \
        --postgres-access="postgresql://haf_admin@localhost:5432/haf_block_log" 2>&1 | tee "${CI_LOGS_DIR}/${CI_JOB_STAGE}/wait-for-ready.log"
    - echo "=== HAFBE environment is ready ==="

.stop_hafbe_environment:
  script:
    - echo "=== Stopping HAFBE environment ==="
    - cd "${CI_PROJECT_DIR}/docker" && docker compose --env-file ci.env --file docker-compose.yml --file overrides/ci.yml down -v 2>&1 | tee -a "${CI_LOGS_DIR}/${CI_JOB_STAGE}/shutdown.log" || true
    - echo "=== Environment stopped ==="
  when: always

.collect_job_logs:
  script:
    - echo "=== Collecting container logs ==="
    - mkdir -p "${CI_LOGS_DIR}/${CI_JOB_STAGE}/containers"
    - cd "${CI_PROJECT_DIR}/docker"
    - for svc in $(docker compose --env-file ci.env --file docker-compose.yml --file overrides/ci.yml ps -a --format '{{.Service}}' 2>/dev/null || true); do
        docker compose --env-file ci.env --file docker-compose.yml --file overrides/ci.yml logs --no-log-prefix --tail=1000 "$svc" > "${CI_LOGS_DIR}/${CI_JOB_STAGE}/containers/${svc}.log" 2>&1 || true
      done
    - echo "=== Container logs collected ==="
  when: always
