stages:
  - build
  - bootstrap
  - sql-check
  - api-regression
  - performance-smoke

variables:
  CI_REGISTRY_IMAGE: "registry.gitlab.syncad.com/hive/haf_block_explorer"
  HAF_REGISTRY: "registry.gitlab.syncad.com/hive/haf"
  HAF_VERSION: "9ec94375"
  HAFAH_VERSION: "latest"
  POSTGREST_VERSION: "latest"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  BUILDKIT_INLINE_CACHE: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  DOCKER_BUILDKIT: "1"
  CI_ARTIFACTS_DIR: "${CI_PROJECT_DIR}/artifacts"
  CI_LOGS_DIR: "${CI_PROJECT_DIR}/logs"
  CI_DIAGNOSTICS_DIR: "${CI_PROJECT_DIR}/diagnostics"
  HAF_DATA_DIRECTORY: "/srv/haf/data"
  HAF_SHM_DIRECTORY: "/srv/haf/shm"
  SETUP_UID: "999"

default:
  image: ${CI_REGISTRY_IMAGE}/ci-runner:latest
  interruptible: true
  tags:
    - hive-io-public-runner
    - haf
  before_script:
    - mkdir -p "${CI_ARTIFACTS_DIR}" "${CI_LOGS_DIR}" "${CI_DIAGNOSTICS_DIR}"
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - docker login -u "${CI_GITLAB_SYNCAD_REGISTRY_USER}" -p "${CI_GITLAB_SYNCAD_REGISTRY_PASSWORD}" "registry.gitlab.syncad.com"

include:
  - local: '/scripts/ci-helpers/skip_rules.yml'
  - local: '/scripts/ci-helpers/diagnostics.yml'

# ============================================================================
# Build Stage - Build Docker images
# ============================================================================

build_docker_images:
  stage: build
  extends: .skip_on_docs_only_or_quick_test
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "=== Building Docker images ==="
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        TAG="${CI_COMMIT_TAG}"
      elif [ "${CI_COMMIT_BRANCH}" = "develop" ] || [ "${CI_COMMIT_BRANCH}" = "master" ]; then
        TAG="${CI_COMMIT_BRANCH}"
      else
        TAG="sha-${CI_COMMIT_SHORT_SHA}"
      fi
    - echo "Using tag: ${TAG}"
    - ./scripts/ci-helpers/build_docker_image.sh "${CI_PROJECT_DIR}" \
        --registry="${CI_REGISTRY_IMAGE}" \
        --tag="${TAG}" \
        --target="full-ci" \
        --progress="plain"
    - ./scripts/ci-helpers/build_docker_image.sh "${CI_PROJECT_DIR}" \
        --registry="${CI_REGISTRY_IMAGE}" \
        --tag="${TAG}" \
        --target="ci-runner-ci" \
        --progress="plain"
    - docker push "${CI_REGISTRY_IMAGE}:${TAG}"
    - docker push "${CI_REGISTRY_IMAGE}/ci-runner:${TAG}"
    - echo "BUILD_TAG=${TAG}" > "${CI_ARTIFACTS_DIR}/build.env"
    - echo "=== Build complete ==="
  artifacts:
    name: "build-artifacts-${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${CI_ARTIFACTS_DIR}/build.env
    expire_in: 1 week
  after_script:
    - !reference [.collect_build_diagnostics, script]

# ============================================================================
# Bootstrap Stage - Start environment and install SQL
# ============================================================================

bootstrap_environment:
  stage: bootstrap
  extends: .skip_test_on_docs_only_with_quick_test
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "=== Bootstrapping test environment ==="
    - source "${CI_ARTIFACTS_DIR}/build.env" 2>/dev/null || true
    - BACKEND_VERSION="${BUILD_TAG:-${CI_COMMIT_SHORT_SHA}}"
    - echo "Using backend version: ${BACKEND_VERSION}"
    - ./scripts/ci-helpers/bootstrap_ci_environment.sh \
        --backend-version="${BACKEND_VERSION}" \
        --haf-data-directory="${HAF_DATA_DIRECTORY}" \
        --haf-shm-directory="${HAF_SHM_DIRECTORY}" \
        --setup-uid="${SETUP_UID}"
    - echo "BOOTSTRAP_COMPLETE=true" > "${CI_ARTIFACTS_DIR}/bootstrap.env"
    - echo "=== Bootstrap complete ==="
  artifacts:
    name: "bootstrap-artifacts-${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${CI_ARTIFACTS_DIR}/
      - ${CI_LOGS_DIR}/bootstrap/
    expire_in: 1 week
    when: always
  after_script:
    - !reference [.collect_bootstrap_diagnostics, script]

# ============================================================================
# SQL Check Stage - Verify SQL installation and run SQL tests
# ============================================================================

sql_check:
  stage: sql-check
  extends: .skip_test_on_docs_only_with_quick_test
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "=== Running SQL checks ==="
    - source "${CI_ARTIFACTS_DIR}/bootstrap.env" 2>/dev/null || true
    - ./scripts/ci-helpers/run_sql_checks.sh \
        --output-dir="${CI_ARTIFACTS_DIR}/sql-check" \
        --logs-dir="${CI_LOGS_DIR}/sql-check"
    - echo "SQL_CHECK_PASSED=true" > "${CI_ARTIFACTS_DIR}/sql-check.env"
    - echo "=== SQL checks complete ==="
  artifacts:
    name: "sql-check-artifacts-${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${CI_ARTIFACTS_DIR}/sql-check/
      - ${CI_LOGS_DIR}/sql-check/
    reports:
      junit: ${CI_ARTIFACTS_DIR}/sql-check/*.xml
    expire_in: 1 week
    when: always
  after_script:
    - !reference [.collect_sql_diagnostics, script]

# ============================================================================
# API Regression Stage - Run Tavern API tests
# ============================================================================

api_regression:
  stage: api-regression
  extends: .skip_test_on_docs_only_with_quick_test
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "=== Running API regression tests ==="
    - source "${CI_ARTIFACTS_DIR}/bootstrap.env" 2>/dev/null || true
    - ./scripts/ci-helpers/run_api_regression.sh \
        --output-dir="${CI_ARTIFACTS_DIR}/api-regression" \
        --logs-dir="${CI_LOGS_DIR}/api-regression"
    - echo "API_REGRESSION_PASSED=true" > "${CI_ARTIFACTS_DIR}/api-regression.env"
    - echo "=== API regression tests complete ==="
  artifacts:
    name: "api-regression-artifacts-${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${CI_ARTIFACTS_DIR}/api-regression/
      - ${CI_LOGS_DIR}/api-regression/
    reports:
      junit: ${CI_ARTIFACTS_DIR}/api-regression/*.xml
    expire_in: 1 week
    when: always
  after_script:
    - !reference [.collect_api_diagnostics, script]

# ============================================================================
# Performance Smoke Stage - Run lightweight performance tests
# ============================================================================

performance_smoke:
  stage: performance-smoke
  extends: .manual_on_feature_branches
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "=== Running performance smoke tests ==="
    - source "${CI_ARTIFACTS_DIR}/bootstrap.env" 2>/dev/null || true
    - ./scripts/ci-helpers/run_performance_smoke.sh \
        --output-dir="${CI_ARTIFACTS_DIR}/performance-smoke" \
        --logs-dir="${CI_LOGS_DIR}/performance-smoke"
    - echo "PERFORMANCE_SMOKE_PASSED=true" > "${CI_ARTIFACTS_DIR}/performance-smoke.env"
    - echo "=== Performance smoke tests complete ==="
  artifacts:
    name: "performance-smoke-artifacts-${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${CI_ARTIFACTS_DIR}/performance-smoke/
      - ${CI_LOGS_DIR}/performance-smoke/
    reports:
      junit: ${CI_ARTIFACTS_DIR}/performance-smoke/*.xml
    expire_in: 1 week
    when: always
  after_script:
    - !reference [.collect_performance_diagnostics, script]
