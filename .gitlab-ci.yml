stages:
  - build
  - test

variables:
  CI_REGISTRY_IMAGE: "registry.gitlab.syncad.com/hive/haf_block_explorer"
  HAF_REGISTRY: "registry.gitlab.syncad.com/hive/haf"
  HAF_VERSION: "9ec94375"
  HAFAH_VERSION: "latest"
  POSTGREST_VERSION: "latest"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  BUILDKIT_INLINE_CACHE: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"
  DOCKER_BUILDKIT: "1"
  CI_ARTIFACTS_DIR: "${CI_PROJECT_DIR}/artifacts"
  CI_LOGS_DIR: "${CI_PROJECT_DIR}/logs"
  CI_DIAGNOSTICS_DIR: "${CI_PROJECT_DIR}/diagnostics"
  HAF_DATA_DIRECTORY: "/srv/haf/data"
  HAF_SHM_DIRECTORY: "/srv/haf/shm"
  SETUP_UID: "999"
  PERFORMANCE_SMOKE_MAX_RESPONSE_TIME: "2000"
  PERFORMANCE_SMOKE_MIN_SUCCESS_RATE: "95"

default:
  image: ${CI_REGISTRY_IMAGE}/ci-runner:latest
  interruptible: true
  tags:
    - hive-io-public-runner
    - haf
  before_script:
    - mkdir -p "${CI_ARTIFACTS_DIR}" "${CI_LOGS_DIR}" "${CI_DIAGNOSTICS_DIR}"
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
    - docker login -u "${CI_GITLAB_SYNCAD_REGISTRY_USER}" -p "${CI_GITLAB_SYNCAD_REGISTRY_PASSWORD}" "registry.gitlab.syncad.com"

include:
  - local: '/scripts/ci-helpers/skip_rules.yml'
  - local: '/scripts/ci-helpers/environment.yml'
  - local: '/scripts/ci-helpers/diagnostics.yml'

# ============================================================================
# Build Stage - Build Docker images (reusing existing build_docker_image.sh)
# ============================================================================

build_docker_images:
  stage: build
  extends: .skip_on_docs_only_or_quick_test
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "=== Building Docker images (reusing build_docker_image.sh) ==="
    - |
      if [ -n "${CI_COMMIT_TAG}" ]; then
        TAG="${CI_COMMIT_TAG}"
      elif [ "${CI_COMMIT_BRANCH}" = "develop" ] || [ "${CI_COMMIT_BRANCH}" = "master" ]; then
        TAG="${CI_COMMIT_BRANCH}"
      else
        TAG="sha-${CI_COMMIT_SHORT_SHA}"
      fi
    - echo "Using tag: ${TAG}"
    - mkdir -p "${CI_LOGS_DIR}/build"
    - ./scripts/ci-helpers/build_docker_image.sh "${CI_PROJECT_DIR}" \
        --registry="${CI_REGISTRY_IMAGE}" \
        --tag="${TAG}" \
        --target="full-ci" \
        --progress="plain" 2>&1 | tee "${CI_LOGS_DIR}/build/build-full.log"
    - ./scripts/ci-helpers/build_docker_image.sh "${CI_PROJECT_DIR}" \
        --registry="${CI_REGISTRY_IMAGE}" \
        --tag="${TAG}" \
        --target="ci-runner-ci" \
        --progress="plain" 2>&1 | tee "${CI_LOGS_DIR}/build/build-ci-runner.log"
    - echo "BUILD_TAG=${TAG}" > "${CI_ARTIFACTS_DIR}/build.env"
    - echo "=== Build complete ==="
  artifacts:
    name: "build-artifacts-${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${CI_ARTIFACTS_DIR}/build.env
      - ${CI_LOGS_DIR}/build/
    expire_in: 1 week
    when: always
  after_script:
    - !reference [.collect_build_diagnostics, script]

# ============================================================================
# Test Stage - Each test job starts its own environment
# ============================================================================

# ----------------------------------------------------------------------------
# SQL Check Job - Validates SQL installation, schema, contexts and tables
#                 Does NOT run regression tests - use run_test.sh for that
# ----------------------------------------------------------------------------

sql_check:
  stage: test
  extends: .skip_test_on_docs_only_with_quick_test
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - !reference [.bootstrap_hafbe_environment, script]
    - echo "=== Running SQL Check (schema/contexts/tables validation) ==="
    - echo "Purpose: Verify SQL installation is correct, schemas exist, contexts are attached"
    - echo "Note: This does NOT run regression tests"
    - mkdir -p "${CI_ARTIFACTS_DIR}/sql-check" "${CI_LOGS_DIR}/sql-check"
    - ./scripts/ci-helpers/sql_check.sh \
        --postgres-access="postgresql://haf_admin@localhost:5432/haf_block_log" \
        --output-dir="${CI_ARTIFACTS_DIR}/sql-check" \
        --logs-dir="${CI_LOGS_DIR}/sql-check"
    - echo "=== SQL Check PASSED ==="
  artifacts:
    name: "sql-check-artifacts-${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${CI_ARTIFACTS_DIR}/sql-check/
      - ${CI_LOGS_DIR}/sql-check/
      - ${CI_LOGS_DIR}/test/bootstrap/
    reports:
      junit: ${CI_ARTIFACTS_DIR}/sql-check/*.xml
    expire_in: 1 week
    when: always
  after_script:
    - !reference [.collect_job_container_logs, script]
    - !reference [.collect_sql_diagnostics, script]
    - !reference [.stop_hafbe_environment, script]

# ----------------------------------------------------------------------------
# API Regression Job - Runs Tavern API tests using existing test framework
# ----------------------------------------------------------------------------

api_regression:
  stage: test
  extends: .skip_test_on_docs_only_with_quick_test
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    HAFBE_ADDRESS: "localhost"
    HAFBE_PORT: "3000"
  script:
    - !reference [.bootstrap_hafbe_environment, script]
    - echo "=== Running API Regression Tests (Tavern/pytest) ==="
    - echo "Purpose: Verify API endpoints return expected results"
    - mkdir -p "${CI_ARTIFACTS_DIR}/api-regression" "${CI_LOGS_DIR}/api-regression"
    - cd tests/tavern
    - pip install tavern[pytest] pytest-xdist pytest-html --quiet
    - TEST_RESULT=0
    - if [ -f pytest.ini ]; then
        pytest -n 8 . \
          --junit-xml="${CI_ARTIFACTS_DIR}/api-regression/tavern-results.xml" \
          --html="${CI_ARTIFACTS_DIR}/api-regression/tavern-report.html" \
          --self-contained-html \
          -v 2>&1 | tee "${CI_LOGS_DIR}/api-regression/tavern.log" || TEST_RESULT=$?
      else
        find . -name "*.tavern.yaml" -exec tavern-ci {} \; 2>&1 | tee "${CI_LOGS_DIR}/api-regression/tavern.log" || TEST_RESULT=$?
      fi
    - cd "${CI_PROJECT_DIR}"
    - |
      if [ "$TEST_RESULT" -eq 0 ]; then
        echo "API_REGRESSION_PASSED=true" > "${CI_ARTIFACTS_DIR}/api-regression/api-regression.env"
        echo "=== API regression tests PASSED ==="
      else
        echo "API_REGRESSION_PASSED=false" > "${CI_ARTIFACTS_DIR}/api-regression/api-regression.env"
        echo "=== API regression tests FAILED ==="
        exit 1
      fi
  artifacts:
    name: "api-regression-artifacts-${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${CI_ARTIFACTS_DIR}/api-regression/
      - ${CI_LOGS_DIR}/api-regression/
      - ${CI_LOGS_DIR}/test/bootstrap/
    reports:
      junit: ${CI_ARTIFACTS_DIR}/api-regression/*.xml
    expire_in: 1 week
    when: always
  after_script:
    - !reference [.collect_job_container_logs, script]
    - !reference [.collect_api_diagnostics, script]
    - !reference [.stop_hafbe_environment, script]

# ----------------------------------------------------------------------------
# Performance Smoke Job - Runs lightweight performance tests
#                         Auto-enabled on develop/master, manual on feature branches
# ----------------------------------------------------------------------------

performance_smoke:
  stage: test
  extends: .manual_on_feature_branches
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    PERFORMANCE_TEST_DURATION: "30s"
    PERFORMANCE_TEST_VUS: "5"
  script:
    - !reference [.bootstrap_hafbe_environment, script]
    - echo "=== Running Performance Smoke Tests ==="
    - echo "Purpose: Verify API performance meets basic thresholds"
    - echo "Thresholds: p95 < ${PERFORMANCE_SMOKE_MAX_RESPONSE_TIME}ms, success rate >= ${PERFORMANCE_SMOKE_MIN_SUCCESS_RATE}%"
    - mkdir -p "${CI_ARTIFACTS_DIR}/performance-smoke" "${CI_LOGS_DIR}/performance-smoke"
    - TEST_RESULT=0
    - if command -v k6 &> /dev/null; then
        echo "Using k6 for performance testing"
        cat > "${CI_ARTIFACTS_DIR}/performance-smoke/smoke-test.js" <<K6EOF
import http from 'k6/http';
import { check, sleep } from 'k6';

export const options = {
    vus: ${PERFORMANCE_TEST_VUS},
    duration: '${PERFORMANCE_TEST_DURATION}',
    thresholds: {
        http_req_duration: ['p(95)<${PERFORMANCE_SMOKE_MAX_RESPONSE_TIME}'],
        http_req_failed: ['rate<0.05'],
    },
};

const ENDPOINTS = [
    'http://localhost:3000/rpc/get_latest_blocks?limit=10',
    'http://localhost:3000/rpc/get_hafbe_version',
];

export default function () {
    const endpoint = ENDPOINTS[Math.floor(Math.random() * ENDPOINTS.length)];
    const res = http.get(endpoint, { timeout: '30s' });
    check(res, {
        'status is 200': (r) => r.status === 200,
        'response time < 5s': (r) => r.timings.duration < 5000,
    });
    sleep(1);
}
K6EOF
        k6 run "${CI_ARTIFACTS_DIR}/performance-smoke/smoke-test.js" \
          --out json="${CI_ARTIFACTS_DIR}/performance-smoke/k6-results.json" \
          --summary-export="${CI_ARTIFACTS_DIR}/performance-smoke/k6-summary.json" \
          2>&1 | tee "${CI_LOGS_DIR}/performance-smoke/performance.log" || TEST_RESULT=$?
      else
        echo "k6 not found, running curl-based smoke test"
        TOTAL_REQUESTS=0
        SUCCESS_REQUESTS=0
        MAX_TIME=0
        for ((i=0; i<20; i++)); do
            for url in "http://localhost:3000/rpc/get_latest_blocks?limit=10" "http://localhost:3000/rpc/get_hafbe_version"; do
                START_REQ=\$(date +%s%N)
                if curl -s -f -o /dev/null -w "%{http_code}" "\$url" | grep -q "200"; then
                    SUCCESS_REQUESTS=\$((SUCCESS_REQUESTS + 1))
                    END_REQ=\$(date +%s%N)
                    ELAPSED=\$(( (END_REQ - START_REQ) / 1000000 ))
                    [ "\$ELAPSED" -gt "\$MAX_TIME" ] && MAX_TIME=\$ELAPSED
                fi
                TOTAL_REQUESTS=\$((TOTAL_REQUESTS + 1))
                sleep 0.5
            done
        done
        SUCCESS_RATE=\$((SUCCESS_REQUESTS * 100 / TOTAL_REQUESTS))
        echo "Total: \$TOTAL_REQUESTS, Success: \$SUCCESS_REQUESTS, Rate: \$SUCCESS_RATE%, Max Time: \$MAX_TIME ms" | tee "${CI_LOGS_DIR}/performance-smoke/performance.log"
        if [ "\$SUCCESS_RATE" -lt "${PERFORMANCE_SMOKE_MIN_SUCCESS_RATE}" ]; then
            echo "FAIL: Success rate \$SUCCESS_RATE% below threshold ${PERFORMANCE_SMOKE_MIN_SUCCESS_RATE}%"
            TEST_RESULT=1
        fi
        if [ "\$MAX_TIME" -gt "${PERFORMANCE_SMOKE_MAX_RESPONSE_TIME}" ]; then
            echo "FAIL: Max response time \$MAX_TIME ms above threshold ${PERFORMANCE_SMOKE_MAX_RESPONSE_TIME} ms"
            TEST_RESULT=1
        fi
      fi
    - |
      if [ "$TEST_RESULT" -eq 0 ]; then
        echo "PERFORMANCE_SMOKE_PASSED=true" > "${CI_ARTIFACTS_DIR}/performance-smoke/performance-smoke.env"
        echo "=== Performance smoke tests PASSED ==="
      else
        echo "PERFORMANCE_SMOKE_PASSED=false" > "${CI_ARTIFACTS_DIR}/performance-smoke/performance-smoke.env"
        echo "=== Performance smoke tests FAILED ==="
        exit 1
      fi
  artifacts:
    name: "performance-smoke-artifacts-${CI_JOB_NAME}-${CI_COMMIT_SHORT_SHA}"
    paths:
      - ${CI_ARTIFACTS_DIR}/performance-smoke/
      - ${CI_LOGS_DIR}/performance-smoke/
      - ${CI_LOGS_DIR}/test/bootstrap/
    expire_in: 1 week
    when: always
  after_script:
    - !reference [.collect_job_container_logs, script]
    - !reference [.collect_performance_diagnostics, script]
    - !reference [.stop_hafbe_environment, script]
